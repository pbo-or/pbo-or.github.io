<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Define the grid pattern size (20px by 20px) -->
    <pattern id="simple-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cccccc" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background sheet color -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Fill rect with the grid pattern -->
  <rect width="100%" height="100%" fill="url(#simple-grid)" />
</svg>